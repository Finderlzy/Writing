site_name: Writing
site_url: https://finderlzy.github.io/Writing/

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  favicon: 09附件/writing-logo.png
  features:
    - navigation.path
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs

extra:
  giscus:
    repo: Finderlzy/Writing
    repo_id: R_kgDOT9EtHA
    category: Comments
    # 开启 Discussions 并安装 Giscus App 后，从 https://giscus.app/zh-CN 复制 data-category-id
    category_id: ""

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/counter.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - nl2br
  - pymdownx.arithmatex:
      generic: true
