site_name: Writing
site_url: https://finderlzy.github.io/Writing/
repo_url: https://github.com/Finderlzy/Writing
repo_name: Finderlzy/Writing

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  favicon: 09附件/writing-logo.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.path
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Finderlzy
      name: Finderlzy 的 GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/finderlzy
      name: X
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/1276546447
      name: 哔哩哔哩
    - icon: fontawesome/brands/tiktok
      link: https://www.douyin.com/user/MS4wLjABAAAAKVCvGwZd3VF4vLg0wcOUD2S2FjqBnIdZ0kJVRJsha10
      name: 抖音
  giscus:
    repo: Finderlzy/Writing
    repo_id: R_kgDOT9EtHA
    category: Comments
    # 分类 ID 可在 https://giscus.app/zh-CN 查询；留空则不显示评论区
    category_id: DIC_kwDOT9EtHM4DHOm0

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/counter.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - nl2br
  - pymdownx.arithmatex:
      generic: true
