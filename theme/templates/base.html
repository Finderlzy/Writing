<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url == "" %}{{ site.site_name }}{% elif page.url == "posts/" or page.article %}{{ page.title }} · {{ site.site_name }}{% else %}{{ page.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ root }}assets/theme/site.css">
    {% if mathjax %}
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
    {% endif %}
    <script defer src="{{ root }}assets/theme/site.js"></script>
  </head>
  <body>
    {# 手画涂鸦（R-VIS-6）：五个 symbol 全站共用，颜色走 CSS 变量，深色下跟着换 #}
    <svg class="doodle-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="star" viewBox="0 0 48 48"><path d="M24 4.5c1.6 0 2.5 1.2 3.4 3.2l3.6 7.6 8.2 1.1c2.2.3 3.4 1.1 3.8 2.4.4 1.3-.2 2.6-1.9 4.1l-6 5.7 1.6 8.2c.4 2.2.1 3.6-1 4.4-1.1.8-2.6.6-4.5-.5L24 36.8l-7.2 3.9c-1.9 1.1-3.4 1.3-4.5.5-1.1-.8-1.4-2.2-1-4.4l1.6-8.2-6-5.7C5.2 21.4 4.6 20.1 5 18.8c.4-1.3 1.6-2.1 3.8-2.4l8.2-1.1 3.6-7.6c.9-2 1.8-3.2 3.4-3.2z" fill="var(--mustard)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M18.5 23.5c.6-1 1.8-1 2.4 0M27.1 23.5c.6-1 1.8-1 2.4 0M20.5 28c2 2.2 5 2.2 7 0" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></symbol>
        <symbol id="note" viewBox="0 0 40 48"><path d="M14 36V9l20-5v26" fill="none" stroke="var(--ink)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 13l20-5" stroke="var(--ink)" stroke-width="5"/>
          <ellipse cx="9" cy="37" rx="6.5" ry="5" transform="rotate(-18 9 37)" fill="var(--ink)"/><ellipse cx="29" cy="31" rx="6.5" ry="5" transform="rotate(-18 29 31)" fill="var(--ink)"/></symbol>
        <symbol id="note1" viewBox="0 0 30 48"><path d="M13 38V6c3 5 10 6 12 13" fill="none" stroke="var(--ink)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <ellipse cx="8" cy="38" rx="6.5" ry="5" transform="rotate(-18 8 38)" fill="var(--ink)"/></symbol>
        <symbol id="drop" viewBox="0 0 30 40"><path d="M15 3C11 12 5 18 5 25.5a10 10 0 0 0 20 0C25 18 19 12 15 3z" fill="var(--sky)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/><path d="M10 26c0 3 2 5 4 5.5" fill="none" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round"/></symbol>
        <symbol id="think" viewBox="0 0 40 48"><ellipse cx="25" cy="13" rx="11" ry="8.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/><ellipse cx="13" cy="31" rx="5.5" ry="4.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="6" cy="42" r="3" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/></symbol>
      </defs>
    </svg>
    <header class="site-header">
      <a class="site-title" href="{{ root }}" data-font="slab"><span class="doodle site-title-star" aria-hidden="true"><svg width="30" height="30"><use href="#star"/></svg></span>{{ site.site_name }}</a>
      <nav class="site-nav">
        <a href="{{ root }}"{% if page.highlight_nav == "home" %} aria-current="page"{% endif %}>首页</a>
        <a href="{{ root }}posts/"{% if page.highlight_nav == "posts" %} aria-current="page"{% endif %}>全部文章</a>
      </nav>
    </header>
    <main class="site-main">
{% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p class="site-footer-links">
        <span class="doodle site-footer-mark" aria-hidden="true"><svg width="20" height="20"><use href="#star"/></svg></span>
        {% if site.social %}
        {% for link in site.social %}<a href="{{ link.url }}" rel="me noopener" data-font="head">{{ link.name }}</a>{% if not loop.last %} · {% endif %}{% endfor %}
        {% endif %}
        <span class="site-footer-copy">· © {{ site.site_name }}</span>
      </p>
    </footer>
  </body>
</html>
