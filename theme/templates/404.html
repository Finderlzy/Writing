{% extends "base.html" %}
{# 404（R-VIS-4）：大号淡色“404”垫在后面，一句说明，两个粗描边按钮回到首页和全部文章。
   地址从站点任意深度打开都要能回根：{{ root }} 是相对网址前缀，不能写成 /。 #}
{% block content %}
<section class="not-found">
  <div class="giant g1" aria-hidden="true" data-font="head">404</div>
  <div class="not-found-body">
    <h1 class="page-title" data-font="head">页面不存在</h1>
    <p class="not-found-say">这个地址没有对应的文章，可能是旧链接，或者文章已经改名。</p>
    <nav class="back-ways" aria-label="回站内的路">
      <a class="back-link" href="{{ root }}"><span class="back-label" data-font="slab">home</span><strong>回到首页</strong></a>
      <a class="back-link" href="{{ root }}posts/"><span class="back-label" data-font="slab">all posts</span><strong>全部文章</strong></a>
    </nav>
  </div>
</section>
{% endblock %}
